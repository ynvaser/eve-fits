<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eve Fits Recursive Directory Browser (Static Index)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Custom Sci-Fi Styling -->
  <style>
    body {
      background-color: #0d1117;
      color: #cdd9e5;
      font-family: 'Exo 2', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 1.5rem;
    }
    h1,
    h2 {
      color: #58a6ff;
      text-shadow: 0 0 8px #58a6ff;
    }
    #readme-container {
      background-color: #161b22;
      border: 1px solid #2389ff;
      border-radius: 0.5rem;
      padding: 1.5rem;
      margin-bottom: 2rem;
      max-height: 40vh;
      overflow-y: auto;
      box-shadow: 0 0 15px #2389ff66;
    }
    #readme-container h2 {
      margin-bottom: 1rem;
    }
    .folder-card {
      background-color: #161b22;
      border: 1px solid #2389ff;
      border-radius: 0.5rem;
      box-shadow: 0 0 15px #2389ff66;
      padding: 1rem 1.2rem;
      margin-bottom: 1.5rem;
    }
    .folder-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: #58a6ff;
      cursor: pointer;
      user-select: none;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid #2389ff44;
    }
    .folder-title:hover {
      color: #3791ff;
      text-shadow: 0 0 8px #3791ff;
    }
    ul {
      list-style: none;
      padding-left: 1rem;
      margin-top: 0.8rem;
    }
    .clickable {
      cursor: pointer;
      color: #58a6ff;
      user-select: none;
      transition: color 0.2s ease;
    }
    .clickable:hover {
      color: #3791ff;
      text-shadow: 0 0 8px #3791ff;
    }
    .filename-red {
      color: #ff4c4c !important;
    }
    pre {
      background-color: #0f1620;
      border: 1px solid #2f74ff;
      border-radius: 0.4rem;
      padding: 1rem;
      overflow-x: auto;
      box-shadow: 0 0 12px #2f74ff99;
      font-size: 0.9rem;
      margin-top: 0.3rem;
      white-space: pre-wrap;
      user-select: text;
      font-family: 'Courier New', Courier, monospace;
    }
    /* Scrollbar for README and pre */
    #readme-container::-webkit-scrollbar,
    pre::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    #readme-container::-webkit-scrollbar-thumb,
    pre::-webkit-scrollbar-thumb {
      background: #2f74ffcc;
      border-radius: 10px;
    }
    #readme-container::-webkit-scrollbar-track,
    pre::-webkit-scrollbar-track {
      background: #0d1117;
    }
  </style>
  <!-- Google Fonts Exo 2 -->
  <link
    href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <!-- Marked.js for Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="container">
    <h1 class="mb-4 text-center">ynvaser/eve-fits Recursive Directory Browser (Static Index)</h1>

    <section id="readme-container" class="mb-5">
      <h2>README.md</h2>
      <div id="readme-content">Loading README.md...</div>
    </section>

    <div id="root-dir-list" class="mb-4"></div>
  </div>

  <script>
    async function loadReadme() {
      try {
        let markdown = null;
        try {
          const res = await fetch('./README.MD');
          if (res.ok) markdown = await res.text();
          else {
            const res2 = await fetch('./README.md');
            if (res2.ok) markdown = await res2.text();
          }
        } catch {}

        if (markdown) {
          document.getElementById('readme-content').innerHTML = marked.parse(markdown);
        } else {
          document.getElementById('readme-content').textContent =
            'No README.md found or could not load.';
        }
      } catch {
        document.getElementById('readme-content').textContent =
          'No README.md found or could not load.';
      }
    }

    function extractTitleFromContent(text) {
      const trimmed = text.trimStart();
      if (!trimmed.startsWith('[')) return null;
      const firstLineEnd = trimmed.indexOf('\n');
      let candidate = firstLineEnd === -1 ? trimmed : trimmed.substring(0, firstLineEnd);
      candidate = candidate.replace('[', '');
      const lastBracketIndex = candidate.lastIndexOf(']');
      if (lastBracketIndex !== -1) {
        candidate = candidate.slice(0, lastBracketIndex) + candidate.slice(lastBracketIndex + 1);
      }
      return candidate;
    }

    async function processFileName(item, title) {
      try {
        const res = await fetch(item.path);
        if (!res.ok) throw new Error('File not found');
        const text = await res.text();
        const extractedTitle = extractTitleFromContent(text);
        if (extractedTitle !== null) {
          title.textContent = extractedTitle;
          title.classList.remove('filename-red');
        } else {
          title.textContent = item.name;
          title.classList.add('filename-red');
        }
        return text;
      } catch {
        title.textContent = item.name;
        title.classList.add('filename-red');
        return null;
      }
    }

    function createFolderCard(name) {
      const card = document.createElement('div');
      card.className = 'folder-card';

      const title = document.createElement('div');
      title.className = 'folder-title clickable';
      title.textContent = name;
      card.appendChild(title);

      const nestedUl = document.createElement('ul');
      nestedUl.style.display = 'none';
      card.appendChild(nestedUl);

      return { card, title, nestedUl };
    }

    async function loadDirectory(path, container) {
      const indexPath = path ? `${path}/index.json` : 'index.json';

      try {
        const res = await fetch(indexPath);
        if (!res.ok) throw new Error('Index JSON not found: ' + indexPath);
        const items = await res.json();

        container.innerHTML = '';

        for (const item of items) {
          if (item.type === 'dir') {
            const { card, title, nestedUl } = createFolderCard(item.name);
            container.appendChild(card);

            title.addEventListener('click', async () => {
              if (nestedUl.style.display === 'none') {
                if (!nestedUl.dataset.loaded) {
                  await loadDirectory(item.path, nestedUl);
                  nestedUl.dataset.loaded = 'true';
                }
                nestedUl.style.display = 'block';
              } else {
                nestedUl.style.display = 'none';
              }
            });
          } else if (item.type === 'file' && item.name.endsWith('.txt')) {
            if (!(container.tagName === 'UL')) continue;

            const li = document.createElement('li');
            const title = document.createElement('span');
            title.className = 'clickable';
            title.textContent = item.name;
            li.appendChild(title);

            const codePre = document.createElement('pre');
            codePre.style.display = 'none';
            li.appendChild(codePre);

            const fileContent = await processFileName(item, title);

            title.addEventListener('click', () => {
              if (codePre.style.display === 'none') {
                if (!codePre.dataset.loaded) {
                  if (fileContent !== null) {
                    codePre.textContent = fileContent;
                    codePre.dataset.loaded = 'true';
                  } else {
                    codePre.textContent = 'Could not load file content.';
                  }
                }
                codePre.style.display = 'block';
              } else {
                codePre.style.display = 'none';
              }
            });

            container.appendChild(li);
          }
        }
      } catch (err) {
        container.textContent = 'Could not load directory contents.';
        console.error(err);
      }
    }

    // Initialize
    loadReadme();
    const rootContainer = document.getElementById('root-dir-list');
    loadDirectory('', rootContainer);
  </script>
</body>
</html>
