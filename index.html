<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Davos's Fits</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Elegant Styling -->
  <style>
    body {
      background-image: url('./background.jpg'); /* Set your image name */
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      padding: 2rem 1rem;
      min-height: 100vh;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(18, 18, 18, 0.7);
      pointer-events: none;
      z-index: -1;
    }
    h1, h2 {
      color: #a0c4ff;
      font-weight: 600;
      margin-bottom: 1rem;
      border-bottom: 1px solid #334e68;
      padding-bottom: 0.25rem;
      font-feature-settings: "liga", "cv02";
    }
    #readme-container {
      background-color: #1e1e1e;
      border: 1px solid #3a5068;
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 2.5rem;
      max-height: 40vh;
      overflow-y: auto;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }
    #readme-container h2 {
      margin-top: 0;
    }
    .folder-card {
      background-color: #1e1e1e;
      border: 1px solid #3a5068;
      border-radius: 6px;
      box-shadow: 0 3px 7px rgba(0,0,0,0.35);
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      transition: background-color 0.25s ease;
    }
    .folder-card:hover {
      background-color: #27384b;
    }
    .folder-title {
      font-weight: 600;
      font-size: 1.1rem;
      color: #a0c4ff;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid #3a5068;
      padding-bottom: 0.3rem;
      margin-bottom: 0.75rem;
      transition: color 0.3s ease;
    }
    .folder-title:hover {
      color: #95a1f9;
    }
    ul {
      list-style: none;
      padding-left: 1rem;
      margin-top: 0;
    }
    .clickable {
      cursor: pointer;
      color: #a0c4ff;
      user-select: none;
      transition: color 0.3s ease;
    }
    .clickable:hover {
      color: #95a1f9;
      text-decoration: underline;
    }
    .clickable:focus-visible {
      outline: 2px solid #a0c4ff;
      outline-offset: 3px;
      border-radius: 2px;
    }
    .filename-red {
      color: #ff6b6b !important;
    }
    pre {
      background-color: #262626;
      border: 1px solid #394b61;
      border-radius: 6px;
      padding: 1rem;
      overflow-x: auto;
      font-size: 0.9rem;
      margin-top: 0.4rem;
      white-space: pre-wrap;
      font-family: 'Source Code Pro', monospace, monospace;
      box-shadow: inset 0 0 6px #0005;
      color: #d4d4d4;
      user-select: text;
    }
    a.evship-link {
      margin-left: 1rem;
      color: #627d98;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
      vertical-align: middle;
      border-bottom: 1px solid transparent;
      transition: color 0.3s ease, border-color 0.3s ease;
    }
    a.evship-link:hover {
      color: #95a1f9;
      border-color: #95a1f9;
      text-decoration: none;
    }
    #readme-container::-webkit-scrollbar,
    pre::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    #readme-container::-webkit-scrollbar-thumb,
    pre::-webkit-scrollbar-thumb {
      background: #627d9822;
      border-radius: 10px;
    }
    #readme-container::-webkit-scrollbar-track,
    pre::-webkit-scrollbar-track {
      background: #121212;
    }
    .pre-container {
      position: relative;
      margin-top: 0.4rem;
    }
    .copy-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background-color: #27384b;
      border: 1px solid #3a5068;
      color: #a0c4ff;
      border-radius: 4px;
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease, background-color 0.2s ease, color 0.2s ease;
      z-index: 10;
    }
    .pre-container:hover .copy-btn,
    .copy-btn:focus-visible {
      opacity: 1;
    }
    .copy-btn:hover {
      background-color: #a0c4ff;
      color: #121212;
    }
    #search-input {
      background-color: #1e1e1e;
      border: 1px solid #3a5068;
      color: #e0e0e0;
      box-shadow: 0 3px 6px rgba(0,0,0,0.25);
    }
    #search-input::placeholder {
      color: #627d98;
    }
    #search-input:focus {
      background-color: #27384b;
      border-color: #a0c4ff;
      color: #ffffff;
      box-shadow: 0 0 8px rgba(160, 196, 255, 0.4);
      outline: none;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="container" style="max-width: 900px;">
    <h1 class="mb-4 text-center">Davos's Fits</h1>
    <section id="readme-container" class="mb-5" aria-label="README content">
      <div id="readme-content">Loading README.md...</div>
    </section>
    <div class="mb-4 search-wrapper">
      <input type="text" id="search-input" class="form-control" placeholder="Search fits or folders..." aria-label="Search fits or folders" />
    </div>
    <div id="root-dir-list" class="mb-4" aria-label="Repository directory listing"></div>
  </div>
  <script>
    const directoryCache = {};

    async function loadReadme() {
      try {
        let markdown = null;
        try {
          const res = await fetch('./README.md');
          if (res.ok) markdown = await res.text();
          else {
            const res2 = await fetch('./README.MD');
            if (res2.ok) markdown = await res2.text();
          }
        } catch {}
        if (markdown) {
          document.getElementById('readme-content').innerHTML = marked.parse(markdown);
        } else {
          document.getElementById('readme-content').textContent =
            'No README.md found or could not load.';
        }
      } catch {
        document.getElementById('readme-content').textContent =
          'No README.md found or could not load.';
      }
    }
    function extractTitleFromContent(text) {
      const trimmed = text.trimStart();
      if (!trimmed.startsWith('[')) return null;
      const firstLineEnd = trimmed.indexOf('\n');
      let candidate = firstLineEnd === -1 ? trimmed : trimmed.substring(0, firstLineEnd);
      candidate = candidate.replace('[', '');
      const lastBracketIndex = candidate.lastIndexOf(']');
      if (lastBracketIndex !== -1) {
        candidate = candidate.slice(0, lastBracketIndex) + candidate.slice(lastBracketIndex + 1);
      }
      return candidate;
    }
    function gzipCompress(data) {
      if (!('CompressionStream' in window)) {
        return Promise.reject(new Error('CompressionStream is not supported in this browser'));
      }
      const cs = new CompressionStream('gzip');
      const writer = cs.writable.getWriter();
      writer.write(data);
      writer.close();
      return new Response(cs.readable).arrayBuffer().then(buf => new Uint8Array(buf));
    }
    function base64Encode(bytes) {
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }
    async function processFileName(item, title) {
      try {
        const res = await fetch(item.path);
        if (!res.ok) throw new Error('File not found');
        const text = await res.text();
        const extractedTitle = extractTitleFromContent(text);
        if (extractedTitle !== null) {
          title.textContent = extractedTitle;
          title.classList.remove('filename-red');
          title.dataset.path = item.path; // Store full path
          return { content: text, shouldShowLink: true };
        } else {
          title.textContent = item.name;
          title.classList.add('filename-red');
          title.dataset.path = item.path; // Store full path anyway
          return { content: text, shouldShowLink: false };
        }
      } catch {
        title.textContent = item.name;
        title.classList.add('filename-red');
        return { content: null, shouldShowLink: false };
      }
    }
    function createFolderCard(name) {
      const card = document.createElement('div');
      card.className = 'folder-card';
      const title = document.createElement('div');
      title.className = 'folder-title clickable';
      title.textContent = name;
      title.setAttribute('role', 'button');
      title.setAttribute('tabindex', '0');
      title.setAttribute('aria-expanded', 'false');
      card.appendChild(title);
      const nestedUl = document.createElement('ul');
      nestedUl.style.display = 'none';
      card.appendChild(nestedUl);
      return { card, title, nestedUl };
    }
    async function loadDirectory(path, container) {
      const indexPath = path ? `${path}/index.json` : 'index.json';
      try {
        let items;
        if (directoryCache[indexPath]) {
          items = directoryCache[indexPath];
        } else {
          const res = await fetch(indexPath);
          if (!res.ok) throw new Error('Index JSON not found: ' + indexPath);
          items = await res.json();
          directoryCache[indexPath] = items;
        }
        container.innerHTML = '';
        const folders = items.filter(item => item.type === 'dir');
        const files = items.filter(item => item.type === 'file' && item.name.endsWith('.txt'));
        for (const item of folders) {
          const { card, title, nestedUl } = createFolderCard(item.name);
          title.dataset.path = item.path;
          container.appendChild(card);
          
          const toggleFolder = async () => {
            if (nestedUl.style.display === 'none') {
              if (!nestedUl.dataset.loaded) {
                await loadDirectory(item.path, nestedUl);
                nestedUl.dataset.loaded = 'true';
              }
              nestedUl.style.display = 'block';
              title.setAttribute('aria-expanded', 'true');
              window.history.replaceState(null, '', '#folder=' + encodeURIComponent(item.path));
            } else {
              nestedUl.style.display = 'none';
              title.setAttribute('aria-expanded', 'false');
              window.history.replaceState(null, '', '#');
            }
          };

          title.addEventListener('click', toggleFolder);
          title.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              toggleFolder();
            }
          });
        }
        if (files.length > 0) {
          let fileUl = container.querySelector('ul.topfile-ul');
          if (!fileUl) {
            fileUl = document.createElement('ul');
            fileUl.className = 'topfile-ul';
            container.appendChild(fileUl);
          }
          
          const filePromises = files.map(async (item) => {
            const li = document.createElement('li');
            li.style.marginBottom = '0.5rem';
            
            if (item.shipTypeId) {
              const img = document.createElement('img');
              img.src = `https://images.evetech.net/types/${item.shipTypeId}/icon?size=32`;
              img.alt = '';
              img.style.width = '24px';
              img.style.height = '24px';
              img.style.marginRight = '8px';
              img.style.verticalAlign = 'middle';
              li.appendChild(img);
            }
            
            const title = document.createElement('span');
            title.className = 'clickable filename-red';
            title.textContent = item.name;
            title.dataset.path = item.path; // important for deep link
            title.setAttribute('role', 'button');
            title.setAttribute('tabindex', '0');
            title.style.verticalAlign = 'middle';
            li.appendChild(title);
            fileUl.appendChild(li);
            
            const { content, shouldShowLink } = await processFileName(item, title);
            if (content === null) return;
            
            const preContainer = document.createElement('div');
            preContainer.className = 'pre-container';
            preContainer.style.display = 'none';
            
            const codePre = document.createElement('pre');
            codePre.textContent = content;
            preContainer.appendChild(codePre);
            
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.textContent = 'Copy';
            copyBtn.setAttribute('aria-label', 'Copy fit to clipboard');
            copyBtn.addEventListener('click', async (e) => {
              e.stopPropagation();
              try {
                await navigator.clipboard.writeText(content);
                copyBtn.textContent = 'Copied!';
                copyBtn.style.backgroundColor = '#4caf50';
                copyBtn.style.borderColor = '#4caf50';
                copyBtn.style.color = '#ffffff';
                setTimeout(() => {
                  copyBtn.textContent = 'Copy';
                  copyBtn.style.backgroundColor = '';
                  copyBtn.style.borderColor = '';
                  copyBtn.style.color = '';
                }, 2000);
              } catch (err) {
                console.error('Failed to copy: ', err);
                copyBtn.textContent = 'Failed';
              }
            });
            preContainer.appendChild(copyBtn);
            
            if (shouldShowLink) {
              title.classList.remove('filename-red');
              try {
                const encoder = new TextEncoder();
                const encoded = encoder.encode(content);
                const compressed = await gzipCompress(encoded);
                const base64 = base64Encode(compressed);
                const eveShipUrl = `https://eveship.fit/?fit=eft:${base64}`;
                const link = document.createElement('a');
                link.href = eveShipUrl;
                link.target = '_blank';
                link.className = 'evship-link';
                link.textContent = '-> Simulate fitting';
                li.appendChild(link);
              } catch (e) {
                console.error('Compression error:', e);
              }
            }
            li.appendChild(preContainer);
            
            const toggleFile = () => {
              preContainer.style.display = preContainer.style.display === 'none' ? 'block' : 'none';
              if (preContainer.style.display === 'block') {
                window.history.replaceState(null, '', '#fit=' + encodeURIComponent(title.dataset.path));
              } else {
                window.history.replaceState(null, '', '#');
              }
            };
            title.addEventListener('click', toggleFile);
            title.addEventListener('keydown', (e) => {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleFile();
              }
            });
          });
          
          await Promise.all(filePromises);
        }
        
        const searchInput = document.getElementById('search-input');
        if (searchInput && searchInput.value.trim() !== '') {
          runSearch(searchInput.value);
        }
      } catch (err) {
        container.textContent = 'Could not load directory contents.';
        console.error(err);
      }
    }
    async function expandFoldersToPath(folderPath) {
      const parts = folderPath.split('/').filter(Boolean);
      let container = document.getElementById('root-dir-list');
      let lastFolderCard = null;
      for (const name of parts) {
        const folderCard = Array.from(container.children).find(
          node => node.querySelector && node.querySelector('.folder-title') &&
                  node.querySelector('.folder-title').textContent === name
        );
        if (!folderCard) return null;
        lastFolderCard = folderCard;
        const folderTitle = folderCard.querySelector('.folder-title');
        const nestedUl = folderCard.querySelector('ul');
        if (nestedUl.style.display === 'none') {
          if (!nestedUl.dataset.loaded) {
            await loadDirectory(folderTitle.dataset.path, nestedUl);
            nestedUl.dataset.loaded = 'true';
          }
          nestedUl.style.display = 'block';
          folderTitle.setAttribute('aria-expanded', 'true');
        }
        container = nestedUl;
      }
      return lastFolderCard;
    }
    async function openFitByPath(path) {
      const parts = path.split('/').filter(Boolean);
      if (parts.length === 0) return false;
      const folderPath = parts.slice(0, -1).join('/');
      const lastFolderCard = folderPath ? await expandFoldersToPath(folderPath) : null;
      const searchContainer = lastFolderCard ? lastFolderCard.querySelector('ul') : document.getElementById('root-dir-list');
      if (!searchContainer) return false;
      
      const li = Array.from(searchContainer.querySelectorAll('li')).find(
        liEl => liEl.querySelector && liEl.querySelector('.clickable') &&
                liEl.querySelector('.clickable').dataset.path === path
      );
      if (li) {
        const titleSpan = li.querySelector('.clickable');
        const preContainer = li.querySelector('.pre-container');
        if (preContainer && preContainer.style.display === 'none') {
          titleSpan.click();
        }
        li.scrollIntoView({ behavior: "smooth", block: "center" });
        return true;
      }
      return false;
    }
    async function handleRouting() {
      const hash = window.location.hash;
      if (hash.startsWith('#fit=')) {
        const fitPath = decodeURIComponent(hash.substring(5));
        await openFitByPath(fitPath);
      } else if (hash.startsWith('#folder=')) {
        const folderPath = decodeURIComponent(hash.substring(8));
        const lastFolderCard = await expandFoldersToPath(folderPath);
        if (lastFolderCard) {
          lastFolderCard.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }
    }
    async function loadAllDirectoriesRecursively(path = '', container = null) {
      if (!container) {
        container = document.getElementById('root-dir-list');
      }
      const folderCards = Array.from(container.children).filter(
        node => node.classList && node.classList.contains('folder-card')
      );
      const promises = folderCards.map(async (card) => {
        const title = card.querySelector('.folder-title');
        const nestedUl = card.querySelector('ul');
        if (!nestedUl.dataset.loaded) {
          await loadDirectory(title.dataset.path, nestedUl);
          nestedUl.dataset.loaded = 'true';
        }
        await loadAllDirectoriesRecursively(title.dataset.path, nestedUl);
      });
      await Promise.all(promises);
    }
    function runSearch(query) {
      const q = query.toLowerCase().trim();
      const rootList = document.getElementById('root-dir-list');
      const folderCards = Array.from(rootList.querySelectorAll('.folder-card'));
      const lis = Array.from(rootList.querySelectorAll('li'));
      const uls = Array.from(rootList.querySelectorAll('ul'));
      
      if (q === '') {
        folderCards.forEach(card => card.style.display = '');
        lis.forEach(li => li.style.display = '');
        uls.forEach(ul => {
          if (ul.className === 'topfile-ul') {
            ul.style.display = '';
            return;
          }
          const title = ul.previousElementSibling;
          if (title && title.classList.contains('folder-title')) {
            ul.style.display = title.getAttribute('aria-expanded') === 'true' ? 'block' : 'none';
          } else {
            ul.style.display = 'none';
          }
        });
        return;
      }
      
      folderCards.forEach(card => card.style.display = 'none');
      lis.forEach(li => li.style.display = 'none');
      uls.forEach(ul => ul.style.display = 'none');
      
      function showAndExpandAncestors(element) {
        let curr = element;
        while (curr && curr !== rootList) {
          if (curr.classList.contains('folder-card')) {
            curr.style.display = '';
          }
          if (curr.tagName === 'UL') {
            curr.style.display = 'block';
          }
          curr = curr.parentElement;
        }
      }
      
      lis.forEach(li => {
        const titleSpan = li.querySelector('.clickable');
        if (titleSpan && titleSpan.textContent.toLowerCase().includes(q)) {
          li.style.display = '';
          showAndExpandAncestors(li);
        }
      });
      
      folderCards.forEach(card => {
        const titleDiv = card.querySelector('.folder-title');
        if (titleDiv && titleDiv.textContent.toLowerCase().includes(q)) {
          card.style.display = '';
          showAndExpandAncestors(card);
          card.querySelectorAll('li').forEach(li => li.style.display = '');
          card.querySelectorAll('.folder-card').forEach(subCard => subCard.style.display = '');
          card.querySelectorAll('ul').forEach(ul => ul.style.display = 'block');
        }
      });
    }

    window.addEventListener('hashchange', handleRouting);
    window.addEventListener('DOMContentLoaded', async () => {
      loadReadme();
      
      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', (e) => {
        runSearch(e.target.value);
      });
      
      const rootContainer = document.getElementById('root-dir-list');
      await loadDirectory('', rootContainer);
      await handleRouting();
      
      loadAllDirectoriesRecursively('', rootContainer);
    });
  </script>
</body>
</html>
