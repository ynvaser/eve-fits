<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Davos's Fits</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Elegant Styling -->
  <style>
    body {
      background-image: url('./background.jpg'); /* Set your image name */
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      padding: 2rem 1rem;
      min-height: 100vh;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(18, 18, 18, 0.7);
      pointer-events: none;
      z-index: -1;
    }
    h1, h2 {
      color: #a0c4ff;
      font-weight: 600;
      margin-bottom: 1rem;
      border-bottom: 1px solid #334e68;
      padding-bottom: 0.25rem;
      font-feature-settings: "liga", "cv02";
    }
    #readme-container {
      background-color: #1e1e1e;
      border: 1px solid #3a5068;
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 2.5rem;
      max-height: 40vh;
      overflow-y: auto;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }
    #readme-container h2 {
      margin-top: 0;
    }
    .folder-card {
      background-color: #1e1e1e;
      border: 1px solid #3a5068;
      border-radius: 6px;
      box-shadow: 0 3px 7px rgba(0,0,0,0.35);
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      transition: background-color 0.25s ease;
    }
    .folder-card:hover {
      background-color: #27384b;
    }
    .folder-title {
      font-weight: 600;
      font-size: 1.1rem;
      color: #a0c4ff;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid #3a5068;
      padding-bottom: 0.3rem;
      margin-bottom: 0.75rem;
      transition: color 0.3s ease;
    }
    .folder-title:hover {
      color: #95a1f9;
    }
    ul {
      list-style: none;
      padding-left: 1rem;
      margin-top: 0;
    }
    .clickable {
      cursor: pointer;
      color: #a0c4ff;
      user-select: none;
      transition: color 0.3s ease;
    }
    .clickable:hover {
      color: #95a1f9;
      text-decoration: underline;
    }
    .filename-red {
      color: #ff6b6b !important;
    }
    pre {
      background-color: #262626;
      border: 1px solid #394b61;
      border-radius: 6px;
      padding: 1rem;
      overflow-x: auto;
      font-size: 0.9rem;
      margin-top: 0.4rem;
      white-space: pre-wrap;
      font-family: 'Source Code Pro', monospace, monospace;
      box-shadow: inset 0 0 6px #0005;
      color: #d4d4d4;
      user-select: text;
    }
    a.evship-link {
      margin-left: 1rem;
      color: #627d98;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
      vertical-align: middle;
      border-bottom: 1px solid transparent;
      transition: color 0.3s ease, border-color 0.3s ease;
    }
    a.evship-link:hover {
      color: #95a1f9;
      border-color: #95a1f9;
      text-decoration: none;
    }
    #readme-container::-webkit-scrollbar,
    pre::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    #readme-container::-webkit-scrollbar-thumb,
    pre::-webkit-scrollbar-thumb {
      background: #627d9822;
      border-radius: 10px;
    }
    #readme-container::-webkit-scrollbar-track,
    pre::-webkit-scrollbar-track {
      background: #121212;
    }
  </style>
  <link 
    href="https://fonts.googleapis.com/css2?family=Source+Code+Pro&display=swap" 
    rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="container" style="max-width: 900px;">
    <h1 class="mb-4 text-center">Davos's Fits</h1>
    <section id="readme-container" class="mb-5" aria-label="README content">
      <div id="readme-content">Loading README.md...</div>
    </section>
    <div id="root-dir-list" class="mb-4" aria-label="Repository directory listing"></div>
  </div>
  <script>
    async function loadReadme() {
      try {
        let markdown = null;
        try {
          const res = await fetch('./README.md');
          if (res.ok) markdown = await res.text();
          else {
            const res2 = await fetch('./README.MD');
            if (res2.ok) markdown = await res2.text();
          }
        } catch {}
        if (markdown) {
          document.getElementById('readme-content').innerHTML = marked.parse(markdown);
        } else {
          document.getElementById('readme-content').textContent =
            'No README.md found or could not load.';
        }
      } catch {
        document.getElementById('readme-content').textContent =
          'No README.md found or could not load.';
      }
    }
    function extractTitleFromContent(text) {
      const trimmed = text.trimStart();
      if (!trimmed.startsWith('[')) return null;
      const firstLineEnd = trimmed.indexOf('\n');
      let candidate = firstLineEnd === -1 ? trimmed : trimmed.substring(0, firstLineEnd);
      candidate = candidate.replace('[', '');
      const lastBracketIndex = candidate.lastIndexOf(']');
      if (lastBracketIndex !== -1) {
        candidate = candidate.slice(0, lastBracketIndex) + candidate.slice(lastBracketIndex + 1);
      }
      return candidate;
    }
    function gzipCompress(data) {
      if (!('CompressionStream' in window)) {
        return Promise.reject(new Error('CompressionStream is not supported in this browser'));
      }
      const cs = new CompressionStream('gzip');
      const writer = cs.writable.getWriter();
      writer.write(data);
      writer.close();
      return new Response(cs.readable).arrayBuffer().then(buf => new Uint8Array(buf));
    }
    function base64Encode(bytes) {
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }
    async function processFileName(item, title) {
      try {
        const res = await fetch(item.path);
        if (!res.ok) throw new Error('File not found');
        const text = await res.text();
        const extractedTitle = extractTitleFromContent(text);
        if (extractedTitle !== null) {
          title.textContent = extractedTitle;
          title.classList.remove('filename-red');
          return { content: text, shouldShowLink: true };
        } else {
          title.textContent = item.name;
          title.classList.add('filename-red');
          return { content: text, shouldShowLink: false };
        }
      } catch {
        title.textContent = item.name;
        title.classList.add('filename-red');
        return { content: null, shouldShowLink: false };
      }
    }
    function createFolderCard(name) {
      const card = document.createElement('div');
      card.className = 'folder-card';
      const title = document.createElement('div');
      title.className = 'folder-title clickable';
      title.textContent = name;
      card.appendChild(title);
      const nestedUl = document.createElement('ul');
      nestedUl.style.display = 'none';
      card.appendChild(nestedUl);
      return { card, title, nestedUl };
    }
    // Modified: always append files to a UL. Works for all directory levels.
    async function loadDirectory(path, container) {
      const indexPath = path ? `${path}/index.json` : 'index.json';
      try {
        const res = await fetch(indexPath);
        if (!res.ok) throw new Error('Index JSON not found: ' + indexPath);
        const items = await res.json();
        container.innerHTML = '';
        // Separate files and folders
        const folders = items.filter(item => item.type === 'dir');
        const files = items.filter(item => item.type === 'file' && item.name.endsWith('.txt'));
        // Folders first
        for (const item of folders) {
          const { card, title, nestedUl } = createFolderCard(item.name);
          container.appendChild(card);
          title.addEventListener('click', async () => {
            if (nestedUl.style.display === 'none') {
              if (!nestedUl.dataset.loaded) {
                await loadDirectory(item.path, nestedUl);
                nestedUl.dataset.loaded = 'true';
              }
              nestedUl.style.display = 'block';
            } else {
              nestedUl.style.display = 'none';
            }
          });
        }
        // Then files
        if (files.length > 0) {
          let fileUl = container.querySelector('ul.topfile-ul');
          if (!fileUl) {
            fileUl = document.createElement('ul');
            fileUl.className = 'topfile-ul';
            container.appendChild(fileUl);
          }
          for (const item of files) {
            const li = document.createElement('li');
            const title = document.createElement('span');
            title.className = 'clickable filename-red';
            title.textContent = item.name;
            li.appendChild(title);
            fileUl.appendChild(li);
            processFileName(item, title).then(async ({content, shouldShowLink}) => {
              if (shouldShowLink && content !== null) {
                title.classList.remove('filename-red');
                try {
                  const encoder = new TextEncoder();
                  const encoded = encoder.encode(content);
                  const compressed = await gzipCompress(encoded);
                  const base64 = base64Encode(compressed);
                  const eveShipUrl = `https://eveship.fit/?fit=eft:${base64}`;
                  const link = document.createElement('a');
                  link.href = eveShipUrl;
                  link.target = '_blank';
                  link.className = 'evship-link';
                  link.textContent = '-> Simulate fitting';
                  li.appendChild(link);
                  const codePre = document.createElement('pre');
                  codePre.textContent = content;
                  li.appendChild(codePre);
                  codePre.style.display = 'none';
                  title.addEventListener('click', () => {
                    codePre.style.display = codePre.style.display === 'none' ? 'block' : 'none';
                  });
                } catch (e) {
                  console.error('Compression error:', e);
                  const codePre = document.createElement('pre');
                  codePre.textContent = content;
                  li.appendChild(codePre);
                  codePre.style.display = 'none';
                  title.addEventListener('click', () => {
                    codePre.style.display = codePre.style.display === 'none' ? 'block' : 'none';
                  });
                }
              } else if(content !== null) {
                const codePre = document.createElement('pre');
                codePre.textContent = content;
                li.appendChild(codePre);
                codePre.style.display = 'none';
                title.addEventListener('click', () => {
                  codePre.style.display = codePre.style.display === 'none' ? 'block' : 'none';
                });
              }
            });
          }
        }
      } catch (err) {
        container.textContent = 'Could not load directory contents.';
        console.error(err);
      }
    }

    // --- Deep linking logic: open fit and expand all folders by hash ---
    async function openFitByPath(path) {
      const parts = path.split('/').filter(Boolean);
      let currentPath = '';
      let container = document.getElementById('root-dir-list');

      // Recursively expand folders.
      for (let i = 0; i < parts.length; ++i) {
        const name = parts[i];
        if (i < parts.length - 1) {
          // Folder: find and expand
          const folderCard = Array.from(container.children).find(
            node => node.querySelector && node.querySelector('.folder-title') && 
                   node.querySelector('.folder-title').textContent === name
          );
          if (!folderCard) return false;
          const folderTitle = folderCard.querySelector('.folder-title');
          const nestedUl = folderCard.querySelector('ul');
          if (nestedUl.style.display === 'none') {
            folderTitle.click();
            await new Promise(resolve => setTimeout(resolve, 200));
          }
          container = nestedUl;
        } else {
          // File: try both raw and title text for match
          const li = Array.from(container.querySelectorAll('li')).find(
            liEl => liEl.querySelector && liEl.querySelector('.clickable') && (
               liEl.querySelector('.clickable').textContent === name // raw match
               // No extracted title here, to keep robust
            )
          );
          if (li) {
            li.querySelector('.clickable').click();
            // Optionally scroll into view
            li.scrollIntoView({ behavior: "smooth", block: "center" });
          }
        }
      }
      return true;
    }

    // --- On page load, handle hash fragment for deep linking ---
    window.addEventListener('DOMContentLoaded', async () => {
      loadReadme();
      const rootContainer = document.getElementById('root-dir-list');
      await loadDirectory('', rootContainer);

      // Open specific fit if hash is present
      const hash = window.location.hash;
      if (hash.startsWith('#fit=')) {
        const fitPath = decodeURIComponent(hash.substring(5));
        setTimeout(() => openFitByPath(fitPath), 350);
      }
    });
	
	title.addEventListener('click', async () => {
  if (nestedUl.style.display === 'none') {
    if (!nestedUl.dataset.loaded) {
      await loadDirectory(item.path, nestedUl);
      nestedUl.dataset.loaded = 'true';
    }
    nestedUl.style.display = 'block';

    // Update URL hash to current folder path
    window.history.replaceState(null, '', '#folder=' + encodeURIComponent(item.path));
  } else {
    nestedUl.style.display = 'none';

    // Clear URL hash or revert to previous or empty
    window.history.replaceState(null, '', '#');
  }
});
title.addEventListener('click', () => {
  codePre.style.display = codePre.style.display === 'none' ? 'block' : 'none';

  // Update URL hash with fit path
  window.history.replaceState(null, '', '#fit=' + encodeURIComponent(item.path));
});


  </script>
</body>
</html>
